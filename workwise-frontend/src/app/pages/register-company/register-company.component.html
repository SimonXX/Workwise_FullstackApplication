<div class="auth-page">
  <div class="auth-header">
    <a class="auth-brand" routerLink="/">
      <i class="fas fa-briefcase brand-icon"></i>
      <span class="brand-text">Workwise</span>
    </a>
  </div>

  <div class="auth-card ww-card">
    <h1>Join as a Company</h1>
    <p class="auth-subtitle">Find the best candidates for your team.</p>

    <form [formGroup]="form" (ngSubmit)="register()">
      <div class="form-field">
        <label for="name">Company Name</label>
        <input id="name" formControlName="name" type="text" class="ww-input" placeholder="Your company name">
        <div *ngIf="isFieldInvalid('name')" class="field-error">Company name is required.</div>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" class="ww-input" placeholder="company&#64;example.com">
        <div *ngIf="isFieldInvalid('email')" class="field-error">Enter a valid email address.</div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" formControlName="password" type="password" class="ww-input" placeholder="Create a password">
        <div *ngIf="isFieldInvalid('password')" class="field-error">Password is required.</div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="phone">Phone</label>
          <input id="phone" formControlName="phone" type="text" class="ww-input" placeholder="Digits only" (keydown)="onKeyDown($event)">
          <div *ngIf="isFieldInvalid('phone')" class="field-error">Phone must contain only digits.</div>
        </div>
        <div class="form-field">
          <label for="website">Website</label>
          <input id="website" formControlName="website" type="text" class="ww-input" placeholder="https://...">
          <div *ngIf="isFieldInvalid('website')" class="field-error">Website is required.</div>
        </div>
      </div>

      <div class="form-field">
        <label for="address">Address</label>
        <input id="address" formControlName="address" type="text" class="ww-input" placeholder="Company address">
        <div *ngIf="isFieldInvalid('address')" class="field-error">Address is required.</div>
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" class="ww-input textarea" placeholder="Tell us about your company" rows="3"></textarea>
        <div *ngIf="isFieldInvalid('description')" class="field-error">Description is required.</div>
      </div>

      <button type="submit" class="ww-btn-primary auth-submit" [disabled]="form.invalid">Create account</button>
    </form>

    <div class="auth-divider">
      <span>Already on Workwise?</span>
    </div>

    <a routerLink="/login" class="ww-btn-outline auth-link-btn">Sign in</a>
  </div>
</div>
