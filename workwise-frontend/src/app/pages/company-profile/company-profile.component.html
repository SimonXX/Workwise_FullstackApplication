<div class="profile-page">
  <!-- Navbar -->
  <nav class="profile-navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <i class="fas fa-briefcase brand-icon"></i>
        <span class="brand-text">Workwise</span>
      </div>
      <div class="navbar-actions">
        <button class="ww-btn-outline" (click)="goToCompanyArea()">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </button>
        <button class="nav-logout-btn" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="profile-container">
    <!-- Profile Header Card -->
    <div class="profile-header-card ww-card">
      <div class="profile-banner"></div>
      <div class="profile-header-body">
        <div class="profile-avatar">
          <img src="assets/images/companyProfile.png" alt="Company">
        </div>
        <div class="profile-header-info">
          <div *ngIf="!editingMode">
            <h1>{{ company.name }}</h1>
            <p class="profile-description">{{ company.description }}</p>
          </div>
          <div *ngIf="editingMode" class="edit-fields">
            <div class="edit-field">
              <label>Company Name</label>
              <input [(ngModel)]="editedCompany.name" class="ww-input" placeholder="Company Name">
            </div>
            <div class="edit-field">
              <label>Description</label>
              <textarea [(ngModel)]="editedCompany.description" class="ww-input textarea" placeholder="Company Description" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="profile-header-actions">
          <button *ngIf="!editingMode" class="ww-btn-primary" (click)="editProfile()">
            <i class="fas fa-pencil-alt"></i> Edit Profile
          </button>
          <button *ngIf="editingMode" class="ww-btn-success" (click)="saveChanges()">
            <i class="fas fa-check"></i> Save
          </button>
          <button *ngIf="editingMode" class="ww-btn-danger" (click)="cancelEditing()">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Contact Info Card -->
    <div class="details-card ww-card">
      <h2 class="section-title">Contact Information</h2>

      <div class="detail-row">
        <div class="detail-icon"><i class="fas fa-phone"></i></div>
        <div class="detail-content">
          <span class="detail-label">Phone</span>
          <span class="detail-value" *ngIf="!editingMode">{{ company.phone || 'Not provided' }}</span>
          <input *ngIf="editingMode" [(ngModel)]="editedCompany.phone" class="ww-input"
                 placeholder="Phone Number" (keydown)="onKeyDown($event)">
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon"><i class="fas fa-map-marker-alt"></i></div>
        <div class="detail-content">
          <span class="detail-label">Address</span>
          <span class="detail-value" *ngIf="!editingMode">{{ company.address || 'Not provided' }}</span>
          <input *ngIf="editingMode" [(ngModel)]="editedCompany.address" class="ww-input" placeholder="Address">
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon"><i class="fas fa-globe"></i></div>
        <div class="detail-content">
          <span class="detail-label">Website</span>
          <a *ngIf="!editingMode" [href]="company.website" target="_blank" class="detail-link">{{ company.website }}</a>
          <input *ngIf="editingMode" [(ngModel)]="editedCompany.website" class="ww-input" placeholder="Website">
        </div>
      </div>
    </div>
  </div>
</div>
