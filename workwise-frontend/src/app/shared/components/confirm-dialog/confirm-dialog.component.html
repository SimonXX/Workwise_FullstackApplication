<h2 mat-dialog-title class="dialog-title">{{ title }}</h2>
<mat-dialog-content class="dialog-content">
  <p>{{ message }}</p>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button mat-dialog-close class="dialog-cancel">{{ cancelText }}</button>
  <button mat-raised-button color="primary" (click)="confirm()" class="dialog-confirm">{{ confirmText }}</button>
</mat-dialog-actions>
